name: Sync Leetcode

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 6"

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      STAGING_FOLDER: .leetcode-sync-staging

    steps:
      - name: Check CSRF token
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${LEETCODE_SESSION:-}" ]; then
            echo "::error::Missing LEETCODE_SESSION secret."
            exit 1
          fi

          if [ -z "${LEETCODE_CSRF_TOKEN:-}" ]; then
            echo "::error::Missing LEETCODE_CSRF_TOKEN secret. Please add a valid CSRF token to the repository secrets."
            exit 1
          fi

          echo "::notice::LEETCODE_CSRF_TOKEN is set. LeetCode CSRF tokens expire periodically — if the sync fails with an auth error, please update the LEETCODE_CSRF_TOKEN repository secret with a fresh token."

      - name: Sync to staging
        id: sync_to_staging
        continue-on-error: true
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ github.token }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: ${{ env.STAGING_FOLDER }}
          verbose: true
          commit-header: "[LeetCode Sync]"

      - name: Report sync failure without failing workflow
        if: steps.sync_to_staging.outcome != 'success'
        run: |
          echo "::warning::LeetCode sync failed. This commonly happens when LEETCODE_SESSION or LEETCODE_CSRF_TOKEN has expired. Update repository secrets and re-run the workflow."

      - name: Checkout latest default branch
        if: steps.sync_to_staging.outcome == 'success'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          fetch-depth: 0

      - name: Organize synced solutions by topic
        if: steps.sync_to_staging.outcome == 'success'
        env:
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
        run: |
          python <<'PY'
          import json
          import os
          import pathlib
          import re
          import shutil
          import urllib.error
          import urllib.request

          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          staging_root = workspace / os.environ["STAGING_FOLDER"]
          final_root = workspace
          dsa_root = final_root / "DSA"
          sql_root = final_root / "SQL"

          category_rules = [
              (
                  "dynamic-programming",
                  {"dynamic-programming", "bitmask", "memoization", "game-theory"},
              ),
              (
                  "graphs",
                  {
                      "graph",
                      "breadth-first-search",
                      "depth-first-search",
                      "topological-sort",
                      "shortest-path",
                      "minimum-spanning-tree",
                      "strongly-connected-component",
                      "union-find",
                  },
              ),
              (
                  "binary-tree",
                  {"tree", "binary-tree", "binary-search-tree"},
              ),
              (
                  "linked-list",
                  {"linked-list", "doubly-linked-list"},
              ),
              (
                  "stack-and-queue",
                  {
                      "stack",
                      "queue",
                      "monotonic-stack",
                      "monotonic-queue",
                      "heap-priority-queue",
                      "design",
                  },
              ),
              ("sliding-window", {"sliding-window"}),
              ("binary-search", {"binary-search"}),
              ("greedy", {"greedy"}),
              (
                  "recursion-and-backtracking",
                  {"recursion", "backtracking", "divide-and-conquer"},
              ),
              (
                  "strings",
                  {"string", "trie", "string-matching", "rolling-hash", "suffix-array"},
              ),
              (
                  "math",
                  {
                      "math",
                      "number-theory",
                      "combinatorics",
                      "probability-and-statistics",
                      "brainteaser",
                      "bit-manipulation",
                  },
              ),
              (
                  "arrays",
                  {
                      "array",
                      "matrix",
                      "hash-table",
                      "sorting",
                      "counting",
                      "enumeration",
                      "prefix-sum",
                      "simulation",
                      "two-pointers",
                  },
              ),
          ]

          keyword_fallbacks = [
              ("linked-list", ("linked-list", "lru-cache", "lfu-cache")),
              ("binary-tree", ("tree", "bst", "binary-tree")),
              ("graphs", ("graph", "course-schedule", "network", "path", "island")),
              ("sliding-window", ("window",)),
              ("binary-search", ("search", "sqrt", "ship", "divisor")),
              ("dynamic-programming", ("subsequence", "partition", "fibonacci")),
              ("greedy", ("jump-game", "cookies", "candy")),
              ("stack-and-queue", ("stack", "queue", "parentheses", "histogram")),
              ("strings", ("string", "substring", "palindrome", "anagram")),
              ("math", ("integer", "number", "pow")),
          ]

          def fetch_topic_tags(title_slug: str) -> list[str]:
              payload = json.dumps(
                  {
                      "query": """
                          query questionTopicTags($titleSlug: String!) {
                            question(titleSlug: $titleSlug) {
                              topicTags {
                                slug
                              }
                            }
                          }
                      """,
                      "variables": {"titleSlug": title_slug},
                  }
              ).encode("utf-8")

              headers = {
                  "Content-Type": "application/json",
                  "Origin": "https://leetcode.com",
                  "Referer": f"https://leetcode.com/problems/{title_slug}/",
                  "User-Agent": "github-actions-leetcode-sync",
              }

              session = os.environ.get("LEETCODE_SESSION")
              csrf = os.environ.get("LEETCODE_CSRF_TOKEN")
              if session and csrf:
                  headers["Cookie"] = f"LEETCODE_SESSION={session}; csrftoken={csrf}"
                  headers["x-csrftoken"] = csrf

              request = urllib.request.Request(
                  "https://leetcode.com/graphql",
                  data=payload,
                  headers=headers,
                  method="POST",
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)

              question = data.get("data", {}).get("question")
              if not question:
                  return []

              return [tag["slug"] for tag in question.get("topicTags", []) if tag.get("slug")]

          def map_category(title_slug: str, topic_tags: list[str]) -> str:
              topic_set = set(topic_tags)
              for category, supported_tags in category_rules:
                  if topic_set & supported_tags:
                      return category

              for category, keywords in keyword_fallbacks:
                  if any(keyword in title_slug for keyword in keywords):
                      return category

              return "arrays"

          def is_sql_problem(problem_path: pathlib.Path, topic_tags: list[str]) -> bool:
              if "database" in topic_tags:
                  return True
              return any(problem_path.glob("*.sql"))

          if not staging_root.exists():
              print("No staging folder found; nothing to organize.")
              raise SystemExit(0)

          final_root.mkdir(parents=True, exist_ok=True)

          for problem_dir in sorted(path for path in staging_root.iterdir() if path.is_dir()):
              title_slug = re.sub(r"^\d+-", "", problem_dir.name)

              try:
                  topic_tags = fetch_topic_tags(title_slug)
              except urllib.error.URLError as exc:
                  print(f"Falling back to keyword mapping for {problem_dir.name}: {exc}")
                  topic_tags = []

              if is_sql_problem(problem_dir, topic_tags):
                  destination_dir = sql_root / problem_dir.name
                  destination_label = "SQL"
              else:
                  category = map_category(title_slug, topic_tags)
                  destination_dir = dsa_root / category / problem_dir.name
                  destination_label = f"DSA/{category}"
              destination_dir.parent.mkdir(parents=True, exist_ok=True)

              for existing_dir in final_root.glob(f"**/{problem_dir.name}"):
                  if (
                      existing_dir != destination_dir
                      and existing_dir != problem_dir
                      and existing_dir.is_dir()
                      and existing_dir != staging_root
                      and staging_root not in existing_dir.parents
                  ):
                      shutil.rmtree(existing_dir)

              if destination_dir.exists():
                  shutil.rmtree(destination_dir)

              shutil.move(str(problem_dir), str(destination_dir))
              print(f"{problem_dir.name} -> {destination_label}")

          if staging_root.exists():
              shutil.rmtree(staging_root)
          PY

      - name: Create pull request with reorganized solutions
        if: steps.sync_to_staging.outcome == 'success'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ github.token }}
          commit-message: "[LeetCode Sync] Organize synced solutions into DSA and SQL"
          title: "[LeetCode Sync] Organize synced solutions into DSA and SQL"
          body: |
            This PR contains the latest synced LeetCode solutions, reorganized into DSA topic folders and SQL.
            Please review and adjust folder/topic placement as needed before merging.
          branch: leetcode-sync/reorganized-solutions
          base: ${{ env.DEFAULT_BRANCH }}
          add-paths: |
            DSA
            SQL
            arrays
            binary-search
            binary-tree
            dynamic-programming
            graphs
            greedy
            linked-list
            math
            recursion-and-backtracking
            sliding-window
            stack-and-queue
            strings
          delete-branch: true
